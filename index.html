<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BLACK STORE | متجر بلاك استور</title>

<!-- Tailwind + Icons + Fonts -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>
  * { font-family: 'Cairo', sans-serif; }
  body { background: #0b0b0b; color: white; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: #adebff; border-radius: 20px; }
  .product-card { transition: 0.25s ease; }
  .product-card:hover { transform: translateY(-6px); border-color: #adebff; box-shadow: 0 0 18px rgba(173,235,255,0.12); }
  .active-category { background: #adebff !important; color: #0b0b0b !important; border-color: #adebff !important; }
  .toast-notification {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: #1f1f1f; backdrop-filter: blur(12px); border: 1px solid #adebff40;
    padding: 10px 24px; border-radius: 60px; font-weight: bold;
    font-size: 0.9rem; z-index: 200; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    animation: fadeUp 0.3s ease; white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
  }
  @keyframes fadeUp {
    from { opacity: 0; bottom: 60px; }
    to { opacity: 1; bottom: 90px; }
  }
  .cart-drawer {
    transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    transform: translateX(100%);
  }
  .cart-drawer.open { transform: translateX(0); }
  .overlay { transition: opacity 0.25s ease; opacity: 0; pointer-events: none; }
  .overlay.active { opacity: 1; pointer-events: auto; }
  .btn-icon i { transition: all 0.2s; }
</style>
</head>
<body class="antialiased">

<!-- HEADER -->
<header class="sticky top-0 z-50 bg-[#111]/90 backdrop-blur border-b border-gray-800">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
    <h1 class="text-2xl font-black tracking-wide">BLACK <span class="text-[#adebff]">STORE</span></h1>
    <div class="flex items-center gap-3">
      <button id="searchBtn" class="w-11 h-11 rounded-xl bg-[#1a1a1a] border border-gray-700 text-[#adebff] text-lg flex items-center justify-center hover:border-[#adebff] transition">
        <i class="bi bi-search"></i>
      </button>
      <button id="cartBtn" class="relative w-11 h-11 rounded-xl bg-[#1a1a1a] border border-gray-700 text-[#adebff] text-lg flex items-center justify-center hover:border-[#adebff] transition">
        <i class="bi bi-cart-fill"></i>
        <span id="cartBadge" class="hidden absolute -top-1 -left-1 bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
      </button>
    </div>
  </div>
</header>

<!-- HERO SECTION -->
<section class="relative overflow-hidden border-b border-[#adebff]/20 bg-gradient-to-br from-[#111] to-black">
  <div class="max-w-7xl mx-auto px-4 py-16 text-center">
    <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-[#adebff]/30 bg-[#adebff]/10 text-[#adebff] text-xs font-bold mb-6">
      <i class="bi bi-stars"></i> <span>متجر بلاك استور</span>
    </div>
    <h2 class="text-4xl md:text-6xl font-black leading-tight">كل ما تحتاجه<br><span class="text-[#adebff]">في مكان واحد</span></h2>
    <p class="text-gray-400 mt-5 max-w-2xl mx-auto text-sm md:text-base">شحن ألعاب - أفلام - مسلسلات - أنمي - إكسسوارات</p>
  </div>
</section>

<!-- SEARCH BAR -->
<div id="searchContainer" class="hidden sticky top-[81px] z-40 bg-[#111]/90 backdrop-blur border-b border-gray-800 px-4 py-3">
  <div class="max-w-4xl mx-auto relative">
    <i class="bi bi-search absolute right-4 top-3 text-gray-500"></i>
    <input id="searchInput" type="text" placeholder="ابحث عن منتج..." class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl py-3 pr-12 pl-4 text-sm focus:outline-none focus:border-[#adebff] transition">
  </div>
</div>

<!-- CATEGORIES -->
<section class="max-w-7xl mx-auto px-4 py-6">
  <div class="flex gap-3 overflow-x-auto pb-2">
    <button data-category="all" class="category-btn active-category whitespace-nowrap px-5 py-2 rounded-full border border-gray-700 bg-[#1a1a1a] text-sm font-bold">الكل</button>
    <button data-category="games" class="category-btn whitespace-nowrap px-5 py-2 rounded-full border border-gray-700 bg-[#1a1a1a] text-sm font-bold">شحن ألعاب</button>
    <button data-category="movies" class="category-btn whitespace-nowrap px-5 py-2 rounded-full border border-gray-700 bg-[#1a1a1a] text-sm font-bold">أفلام</button>
    <button data-category="anime" class="category-btn whitespace-nowrap px-5 py-2 rounded-full border border-gray-700 bg-[#1a1a1a] text-sm font-bold">أنمي</button>
    <button data-category="series" class="category-btn whitespace-nowrap px-5 py-2 rounded-full border border-gray-700 bg-[#1a1a1a] text-sm font-bold">مسلسلات</button>
    <button data-category="accessories" class="category-btn whitespace-nowrap px-5 py-2 rounded-full border border-gray-700 bg-[#1a1a1a] text-sm font-bold">إكسسوارات</button>
  </div>
</section>

<!-- PRODUCTS GRID -->
<main class="max-w-7xl mx-auto px-4 pb-24">
  <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
</main>

<!-- WHATSAPP FLOATING BUTTON -->
<a href="https://wa.me/249115169965" target="_blank" rel="noopener noreferrer" 
   class="fixed bottom-6 left-4 md:left-8 z-40 w-12 h-12 rounded-full bg-white text-[#0B0B0B] flex items-center justify-center shadow-2xl border border-gray-200/20 active:scale-90 transition hover:bg-[#adebff]" 
   aria-label="تواصل عبر واتساب">
  <i class="bi bi-whatsapp text-xl"></i>
</a>

<!-- FOOTER -->
<footer class="border-t border-gray-800 mt-8 py-8 text-center text-gray-400 text-xs">
  <div class="flex justify-center gap-6 mb-4 text-lg">
    <a href="https://www.facebook.com/share/1DxzygXXEq/" target="_blank"><i class="bi bi-facebook"></i></a>
    <a href="https://whatsapp.com/channel/0029VbBPZEJEawdxH4lz810V" target="_blank"><i class="bi bi-whatsapp"></i></a>
  </div>
  <p>© 2025 BLACK STORE — جميع الحقوق محفوظة</p>
</footer>

<!-- CART DRAWER -->
<div id="cartOverlay" class="overlay fixed inset-0 bg-black/70 z-[100] transition-all"></div>
<div id="cartDrawer" class="cart-drawer fixed top-0 left-0 w-full sm:max-w-md h-full bg-[#0f0f0f] border-l border-[#adebff]/30 shadow-2xl z-[150] flex flex-col">
  <div class="flex items-center justify-between p-5 border-b border-gray-800">
    <h2 class="text-xl font-black flex items-center gap-2"><i class="bi bi-bag-check text-[#adebff]"></i> سلة المشتريات</h2>
    <button id="closeCartBtn" class="w-8 h-8 rounded-full bg-[#1f1f1f] text-gray-300 hover:text-white flex items-center justify-center"><i class="bi bi-x-lg text-sm"></i></button>
  </div>
  <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
  <div class="border-t border-gray-800 p-4 space-y-3">
    <div class="flex justify-between text-lg font-bold"><span>الإجمالي</span><span id="cartTotalPrice" class="text-[#adebff]">0 SDG</span></div>
    <button id="checkoutBtn" class="w-full py-3 rounded-xl bg-[#adebff] text-black font-black flex items-center justify-center gap-2 transition hover:bg-white"><i class="bi bi-whatsapp"></i> إتمام الطلب عبر واتساب</button>
    <button id="clearCartBtn" class="w-full py-2 rounded-lg border border-red-500/60 text-red-400 text-sm font-bold hover:bg-red-500/10 transition flex items-center justify-center gap-2"><i class="bi bi-trash3"></i> تفريغ السلة</button>
  </div>
</div>

<div id="toastMsg" style="display:none;" class="toast-notification"></div>

<script>
// ----------------------------- 1. PRODUCTS INIT (Synchronized with Admin) -----------------------------
const FULL_PRODUCTS_LIST = [
  { id: 1, name: 'شحن 660 شدة ببجي', category: 'games', price: 4500, icon: 'bi-joystick', description: 'شحن فوري وآمن - UC' },
  { id: 2, name: 'فيلم Interstellar', category: 'movies', price: 700, icon: 'bi-film', description: '4K UHD + ترجمة' },
  { id: 3, name: 'شحن 1500 نقطة فري فاير', category: 'games', price: 3200, icon: 'bi-controller', description: 'دائم + هدية' },
  { id: 4, name: 'مسلسل The Last of Us', category: 'series', price: 1200, icon: 'bi-tv', description: 'الموسم الأول HD' },
  { id: 5, name: 'أنمي Demon Slayer', category: 'anime', price: 950, icon: 'bi-gem', description: 'جميع المواسم + فيلم' },
  { id: 6, name: 'سماعة راس gaming', category: 'accessories', price: 8700, icon: 'bi-headset', description: '7.1 محيطي إضاءة' },
  { id: 7, name: 'فيلم Inception', category: 'movies', price: 650, icon: 'bi-camera-reels', description: 'نسخة المخرج' },
  { id: 8, name: 'أنمي Attack on Titan', category: 'anime', price: 1100, icon: 'bi-shield-shaded', description: 'الموسم النهائي' },
  { id: 9, name: 'مسلسل Game of Thrones', category: 'series', price: 2200, icon: 'bi-crown', description: 'جميع المواسم كاملة' },
  { id: 10, name: 'ماوس باد احترافي', category: 'accessories', price: 3400, icon: 'bi-mouse2', description: 'كبير مضاد للانزلاق' },
  { id: 11, name: 'شحن 500 جيمنج', category: 'games', price: 2850, icon: 'bi-dice-6', description: 'لأي لعبة عند الطلب' }
];

function initializeProducts() {
  const stored = localStorage.getItem('blackstore_products');
  if (!stored) {
    localStorage.setItem('blackstore_products', JSON.stringify(FULL_PRODUCTS_LIST));
    return FULL_PRODUCTS_LIST;
  }
  return JSON.parse(stored);
}

let PRODUCTS = initializeProducts();

// ----------------------------- 2. CART LOGIC -----------------------------
let cart = { items: [] };

function loadCartFromStorage() {
  const storedCart = localStorage.getItem('blackstore_cart');
  if (storedCart) {
    try { cart = JSON.parse(storedCart); if (!cart.items) cart.items = []; } catch(e) { cart = { items: [] }; }
  } else { cart = { items: [] }; }
}

function saveCartToStorage() { localStorage.setItem('blackstore_cart', JSON.stringify(cart)); }
function updateCartBadge() {
  const badge = document.getElementById('cartBadge');
  const totalQty = cart.items.reduce((sum, item) => sum + (item.quantity || 1), 0);
  if (totalQty > 0) { badge.innerText = totalQty; badge.classList.remove('hidden'); } 
  else { badge.classList.add('hidden'); }
}

function addToCart(productId) {
  const product = PRODUCTS.find(p => p.id === productId);
  if (!product) { showToast("المنتج غير موجود!", false); return; }
  const existingItem = cart.items.find(item => item.id === productId);
  if (existingItem) existingItem.quantity += 1;
  else cart.items.push({ id: product.id, name: product.name, price: product.price, icon: product.icon || 'bi-box', quantity: 1 });
  saveCartToStorage(); updateCartBadge(); renderCartDrawer();
  showToast(`تمت إضافة ${product.name} إلى السلة`, true);
}

function removeCartItem(productId) {
  const index = cart.items.findIndex(item => item.id === productId);
  if (index !== -1) {
    if (cart.items[index].quantity > 1) cart.items[index].quantity -= 1;
    else cart.items.splice(index, 1);
    saveCartToStorage(); updateCartBadge(); renderCartDrawer();
    showToast("تم تحديث السلة", true);
  }
}
function clearCart() { cart.items = []; saveCartToStorage(); updateCartBadge(); renderCartDrawer(); showToast("تم تفريغ السلة", true); }
function getCartTotal() { return cart.items.reduce((sum, item) => sum + (item.price * item.quantity), 0); }

function renderCartDrawer() {
  const container = document.getElementById('cartItemsContainer');
  if (!container) return;
  if (cart.items.length === 0) {
    container.innerHTML = `<div class="text-center py-16 text-gray-400"><i class="bi bi-emoji-frown text-5xl"></i><p class="mt-3">السلة فارغة</p><p class="text-xs mt-1">أضف منتجاتك المفضلة</p></div>`;
    document.getElementById('cartTotalPrice').innerText = `0 SDG`;
    return;
  }
  let itemsHtml = '';
  cart.items.forEach(item => {
    const itemTotal = item.price * item.quantity;
    itemsHtml += `<div class="flex gap-3 bg-[#1a1a1a] p-3 rounded-2xl border border-gray-800">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#252525] to-black flex items-center justify-center text-[#adebff] text-2xl"><i class="bi ${item.icon}"></i></div>
        <div class="flex-1"><div class="flex justify-between items-start"><h4 class="font-bold text-sm">${item.name}</h4><button class="remove-item text-gray-400 hover:text-red-400 text-sm" data-id="${item.id}"><i class="bi bi-trash3"></i></button></div>
        <div class="flex justify-between items-center mt-2"><span class="text-[#adebff] font-bold text-sm">${item.price} SDG</span><div class="flex items-center gap-2"><button class="decrease-qty bg-gray-800 w-7 h-7 rounded-full text-white font-bold text-xs" data-id="${item.id}">-</button><span class="text-sm font-bold w-6 text-center">${item.quantity}</span><button class="increase-qty bg-gray-800 w-7 h-7 rounded-full text-white font-bold text-xs" data-id="${item.id}">+</button></div></div>
        <div class="text-left text-[11px] text-gray-400 mt-1">الإجمالي: ${itemTotal} SDG</div></div></div>`;
  });
  container.innerHTML = itemsHtml;
  document.getElementById('cartTotalPrice').innerText = `${getCartTotal()} SDG`;
  document.querySelectorAll('.remove-item').forEach(btn => btn.addEventListener('click', (e) => { removeCartItem(parseInt(btn.dataset.id)); e.stopPropagation(); }));
  document.querySelectorAll('.decrease-qty').forEach(btn => btn.addEventListener('click', (e) => { removeCartItem(parseInt(btn.dataset.id)); e.stopPropagation(); }));
  document.querySelectorAll('.increase-qty').forEach(btn => btn.addEventListener('click', (e) => { const id = parseInt(btn.dataset.id); const existing = cart.items.find(i => i.id === id); if(existing) { existing.quantity += 1; saveCartToStorage(); updateCartBadge(); renderCartDrawer(); } e.stopPropagation(); }));
}

// Toast with icons instead of emojis
let toastTimeout;
function showToast(message, isSuccess = true) {
  const toast = document.getElementById('toastMsg');
  if (!toast) return;
  clearTimeout(toastTimeout);
  const icon = isSuccess ? '<i class="bi bi-check-circle-fill text-[#adebff]"></i>' : '<i class="bi bi-exclamation-triangle-fill text-red-400"></i>';
  toast.innerHTML = `${icon} <span>${message}</span>`;
  toast.style.display = 'flex';
  toast.style.backgroundColor = isSuccess ? '#0f2a1a' : '#2a1a1f';
  toast.style.border = `1px solid ${isSuccess ? '#adebff' : '#ff8a8a'}`;
  toastTimeout = setTimeout(() => toast.style.display = 'none', 2000);
}

// ----------------------------- 3. RENDER PRODUCTS -----------------------------
let currentCategory = 'all';
let searchQuery = '';
const productsGrid = document.getElementById('productsGrid');

function renderProducts() {
  const storedProducts = localStorage.getItem('blackstore_products');
  if (storedProducts) PRODUCTS = JSON.parse(storedProducts);
  let filtered = PRODUCTS.filter(product => (currentCategory === 'all' || product.category === currentCategory) &&
    (product.name.toLowerCase().includes(searchQuery.toLowerCase()) || product.description.toLowerCase().includes(searchQuery.toLowerCase())));
  if (filtered.length === 0) { productsGrid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-500"><i class="bi bi-box-seam text-6xl"></i><p class="mt-4">لا توجد منتجات</p></div>`; return; }
  productsGrid.innerHTML = filtered.map(product => `<div class="product-card bg-[#131313] border border-gray-800 rounded-2xl p-4 flex flex-col justify-between"><div><div class="h-40 rounded-2xl bg-gradient-to-br from-[#1a1a1a] to-black border border-gray-800 flex items-center justify-center text-6xl text-[#adebff]"><i class="bi ${product.icon || 'bi-box'}"></i></div><h3 class="font-black text-lg mt-4">${product.name}</h3><p class="text-gray-400 text-sm mt-2">${product.description}</p><div class="flex items-center justify-between mt-4"><span class="text-gray-500 text-sm">السعر</span><span class="text-[#adebff] font-black text-xl">${product.price} SDG</span></div></div><button class="add-to-cart-btn mt-5 w-full py-3 rounded-xl bg-[#adebff] text-black font-black transition hover:bg-white flex items-center justify-center gap-2" data-id="${product.id}"><i class="bi bi-cart-plus"></i> إضافة للسلة</button></div>`).join('');
  document.querySelectorAll('.add-to-cart-btn').forEach(btn => { btn.removeEventListener('click', handleAddClick); btn.addEventListener('click', handleAddClick); });
}
function handleAddClick(e) { addToCart(parseInt(e.currentTarget.getAttribute('data-id'))); }

// ----------------------------- 4. DRAWER & EVENTS -----------------------------
const cartDrawer = document.getElementById('cartDrawer'), overlay = document.getElementById('cartOverlay');
document.getElementById('cartBtn').addEventListener('click', () => { renderCartDrawer(); cartDrawer.classList.add('open'); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; });
document.getElementById('closeCartBtn').addEventListener('click', () => { cartDrawer.classList.remove('open'); overlay.classList.remove('active'); document.body.style.overflow = ''; });
overlay.addEventListener('click', () => { cartDrawer.classList.remove('open'); overlay.classList.remove('active'); document.body.style.overflow = ''; });
document.getElementById('clearCartBtn').addEventListener('click', () => { if (cart.items.length === 0) showToast("السلة فارغة", false); else if (confirm('هل تريد تفريغ السلة؟')) clearCart(); });
document.getElementById('checkoutBtn').addEventListener('click', () => { if (cart.items.length === 0) { showToast("أضف منتجات أولاً", false); return; } let msg = "🛒 *طلب جديد من BLACK STORE*%0A%0A"; cart.items.forEach(item => msg += `• ${item.name} × ${item.quantity} = ${item.price * item.quantity} SDG%0A`); msg += `%0A📦 *الإجمالي:* ${getCartTotal()} SDG%0A%0A🧑‍💼 أود تأكيد طلبي.`; window.open(`https://wa.me/249115169965?text=${msg}`, '_blank'); });
document.querySelectorAll('.category-btn').forEach(btn => btn.addEventListener('click', () => { document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active-category')); btn.classList.add('active-category'); currentCategory = btn.dataset.category; renderProducts(); }));
document.getElementById('searchBtn').addEventListener('click', () => document.getElementById('searchContainer').classList.toggle('hidden'));
document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value; renderProducts(); });
window.addEventListener('storage', (e) => { if (e.key === 'blackstore_products') { PRODUCTS = JSON.parse(e.newValue) || PRODUCTS; renderProducts(); } if (e.key === 'blackstore_cart') { loadCartFromStorage(); updateCartBadge(); if (cartDrawer.classList.contains('open')) renderCartDrawer(); } });
loadCartFromStorage(); updateCartBadge(); renderProducts();
</script>
</body>
</html>
