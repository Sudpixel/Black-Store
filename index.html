<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLACK STORE</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <style>
    *{
      font-family:'Cairo',sans-serif;
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0b0b0b;
      color:white;
      overflow-x:hidden;
    }

    ::-webkit-scrollbar{
      width:5px;
    }

    ::-webkit-scrollbar-thumb{
      background:#adebff;
      border-radius:20px;
    }

    .product-card{
      transition:0.3s ease;
    }

    .product-card:hover{
      transform:translateY(-8px);
      border-color:#adebff;
      box-shadow:0 0 20px rgba(173,235,255,0.15);
    }

    .active-category{
      background:#adebff !important;
      color:black !important;
      border-color:#adebff !important;
    }

    .toast{
      animation:fade 0.4s ease;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="sticky top-0 z-50 bg-[#111]/90 backdrop-blur border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-black tracking-wide">
          BLACK <span class="text-[#adebff]">STORE</span>
        </h1>
      </div>

      <div class="flex items-center gap-3">
        <button id="searchBtn" class="w-11 h-11 rounded-xl bg-[#1a1a1a] border border-gray-700 text-[#adebff] text-lg flex items-center justify-center">
          <i class="bi bi-search"></i>
        </button>

        <button id="cartBtn" class="relative w-11 h-11 rounded-xl bg-[#1a1a1a] border border-gray-700 text-[#adebff] text-lg flex items-center justify-center">
          <i class="bi bi-cart-fill"></i>
          <span id="cartBadge" class="hidden absolute -top-1 -left-1 bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="relative overflow-hidden border-b border-[#adebff]/20 bg-gradient-to-br from-[#111] to-black">
    <div class="max-w-7xl mx-auto px-4 py-16 text-center">
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-[#adebff]/30 bg-[#adebff]/10 text-[#adebff] text-xs font-bold mb-6">
        <i class="bi bi-stars"></i>
        متجر الألعاب والأفلام والإكسسوارات
      </div>

      <h2 class="text-4xl md:text-6xl font-black leading-tight">
        كل ما تحتاجه<br>
        <span class="text-[#adebff]">في مكان واحد</span>
      </h2>

      <p class="text-gray-400 mt-5 max-w-2xl mx-auto text-sm md:text-base">
        شحن ألعاب - أفلام - مسلسلات - أنمي - إكسسوارات - توصيل فوري وجودة عالية
      </p>
    </div>
  </section>

  <!-- SEARCH -->
  <div id="searchContainer" class="hidden sticky top-[81px] z-40 bg-[#111]/90 backdrop-blur border-b border-gray-800 px-4 py-3">
    <div class="max-w-4xl mx-auto relative">
      <i class="bi bi-search absolute right-4 top-3 text-gray-500"></i>
      <input id="searchInput" type="text" placeholder="ابحث عن منتج..." class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl py-3 pr-12 pl-4 text-sm focus:outline-none focus:border-[#adebff]">
    </div>
  </div>

  <!-- CATEGORIES -->
  <section class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex gap-3 overflow-x-auto pb-2">
      <button data-category="all" class="category-btn active-category whitespace-nowrap px-5 py-2 rounded-full border border-gray-700 bg-[#1a1a1a] text-sm font-bold">الكل</button>
      <button data-category="games" class="category-btn whitespace-nowrap px-5 py-2 rounded-full border border-gray-700 bg-[#1a1a1a] text-sm font-bold">شحن ألعاب</button>
      <button data-category="movies" class="category-btn whitespace-nowrap px-5 py-2 rounded-full border border-gray-700 bg-[#1a1a1a] text-sm font-bold">أفلام</button>
      <button data-category="anime" class="category-btn whitespace-nowrap px-5 py-2 rounded-full border border-gray-700 bg-[#1a1a1a] text-sm font-bold">أنمي</button>
      <button data-category="series" class="category-btn whitespace-nowrap px-5 py-2 rounded-full border border-gray-700 bg-[#1a1a1a] text-sm font-bold">مسلسلات</button>
      <button data-category="accessories" class="category-btn whitespace-nowrap px-5 py-2 rounded-full border border-gray-700 bg-[#1a1a1a] text-sm font-bold">إكسسوارات</button>
    </div>
  </section>

  <!-- PRODUCTS -->
  <main class="max-w-7xl mx-auto px-4 pb-20">
    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <!-- CART -->
  <div id="cartOverlay" class="hidden fixed inset-0 bg-black/70 z-40"></div>

  <div id="cartDrawer" class="fixed top-0 left-0 h-full w-full sm:w-[420px] bg-[#111] border-r border-gray-800 z-50 transform -translate-x-full transition duration-300 flex flex-col">

    <div class="p-5 border-b border-gray-800 flex items-center justify-between">
      <h2 class="font-black text-lg flex items-center gap-2">
        <i class="bi bi-cart-fill text-[#adebff]"></i>
        سلة المشتريات
      </h2>

      <button id="closeCart" class="w-9 h-9 rounded-lg bg-[#1a1a1a] border border-gray-700 flex items-center justify-center text-gray-300">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

    <div class="border-t border-gray-800 p-5 space-y-4 bg-[#0d0d0d]">
      <div class="flex items-center justify-between">
        <span class="text-gray-400">الإجمالي:</span>
        <span id="cartTotal" class="font-black text-[#adebff] text-xl">0 SDG</span>
      </div>

      <button id="checkoutBtn" class="w-full py-3 rounded-xl bg-[#adebff] text-black font-black flex items-center justify-center gap-2">
        <i class="bi bi-whatsapp"></i>
        إتمام الطلب
      </button>

      <button id="clearCartBtn" class="w-full py-3 rounded-xl border border-red-500 text-red-400 font-bold text-sm">
        مسح السلة
      </button>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="border-t border-gray-800 py-10 text-center text-gray-400 text-sm">
    <div class="flex justify-center gap-5 text-xl mb-5">
      <a href="https://www.facebook.com/share/1DxzygXXEq/"><i class="bi bi-facebook hover:text-[#adebff]"></i></a>
      <a href="https://whatsapp.com/channel/0029VbBPZEJEawdxH4lz810V"><i class="bi bi-whatsapp hover:text-[#adebff]"></i></a>
    </div>

    <p>© 2026 BLACK STORE - جميع الحقوق محفوظة</p>
  </footer>

  <script>

    const PRODUCTS = [
      {
        id:1,
        name:'شحن 660 شدة ببجي',
        category:'games',
        price:4500,
        icon:'bi-controller',
        description:'شحن فوري وآمن'
      },
      {
        id:2,
        name:'أنمي Attack on Titan',
        category:'anime',
        price:1200,
        icon:'bi-fire',
        description:'جميع المواسم'
      },
      {
        id:3,
        name:'سماعة بلوتوث احترافية',
        category:'accessories',
        price:6500,
        icon:'bi-headphones',
        description:'Bass قوي وصوت نقي'
      },
      {
        id:4,
        name:'فيلم Interstellar',
        category:'movies',
        price:700,
        icon:'bi-film',
        description:'4K UHD'
      },
      {
        id:5,
        name:'مسلسل Breaking Bad',
        category:'series',
        price:1500,
        icon:'bi-tv',
        description:'كامل مترجم'
      },
      {
        id:6,
        name:'Power Bank 20000mAh',
        category:'accessories',
        price:5500,
        icon:'bi-battery-charging',
        description:'شحن سريع'
      },
      {
        id:7,
        name:'شحن Free Fire',
        category:'games',
        price:5000,
        icon:'bi-lightning-charge-fill',
        description:'إرسال فوري'
      },
      {
        id:8,
        name:'فيلم Spider-Man',
        category:'movies',
        price:900,
        icon:'bi-camera-reels-fill',
        description:'نسخة HD'
      }
    ];

    let cart = JSON.parse(localStorage.getItem('blackstore_cart')) || [];
    let currentCategory = 'all';
    let searchQuery = '';

    const productsGrid = document.getElementById('productsGrid');
    const cartItems = document.getElementById('cartItems');
    const cartTotal = document.getElementById('cartTotal');
    const cartBadge = document.getElementById('cartBadge');

    function saveCart(){
      localStorage.setItem('blackstore_cart',JSON.stringify(cart));
    }

    function renderProducts(){

      const filtered = PRODUCTS.filter(product=>{
        const categoryMatch = currentCategory === 'all' || product.category === currentCategory;

        const searchMatch = product.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                            product.description.toLowerCase().includes(searchQuery.toLowerCase());

        return categoryMatch && searchMatch;
      });

      productsGrid.innerHTML = filtered.map(product=>`
        <div class="product-card bg-[#131313] border border-gray-800 rounded-2xl p-4 flex flex-col justify-between">

          <div>
            <div class="h-40 rounded-2xl bg-gradient-to-br from-[#1a1a1a] to-black border border-gray-800 flex items-center justify-center text-6xl text-[#adebff]">
              <i class="bi ${product.icon}"></i>
            </div>

            <h3 class="font-black text-lg mt-4">${product.name}</h3>

            <p class="text-gray-400 text-sm mt-2">${product.description}</p>

            <div class="flex items-center justify-between mt-4">
              <span class="text-gray-500 text-sm">السعر</span>
              <span class="text-[#adebff] font-black text-xl">${product.price} SDG</span>
            </div>
          </div>

          <button onclick="addToCart(${product.id})" class="mt-5 w-full py-3 rounded-xl bg-[#adebff] text-black font-black flex items-center justify-center gap-2 hover:bg-white transition">
            <i class="bi bi-cart-plus-fill"></i>
            إضافة للسلة
          </button>
        </div>
      `).join('');
    }

    function addToCart(id){

      const product = PRODUCTS.find(p=>p.id === id);

      const existing = cart.find(item=>item.id === id);

      if(existing){
        existing.quantity += 1;
      }else{
        cart.push({...product,quantity:1});
      }

      saveCart();
      renderCart();
      showToast('تمت إضافة المنتج للسلة');
    }

    function renderCart(){

      if(cart.length === 0){
        cartItems.innerHTML = `
          <div class="text-center py-20 text-gray-500">
            <i class="bi bi-cart-x text-6xl"></i>
            <p class="mt-4">السلة فارغة</p>
          </div>
        `;

        cartBadge.classList.add('hidden');
        cartTotal.innerText = '0 SDG';

        return;
      }

      let total = 0;
      let totalItems = 0;

      cartItems.innerHTML = cart.map(item=>{

        total += item.price * item.quantity;
        totalItems += item.quantity;

        return `
          <div class="bg-[#1a1a1a] border border-gray-800 rounded-xl p-4">

            <div class="flex items-center justify-between gap-3">

              <div class="flex items-center gap-3">
                <div class="w-14 h-14 rounded-xl bg-black border border-gray-700 flex items-center justify-center text-[#adebff] text-2xl">
                  <i class="bi ${item.icon}"></i>
                </div>

                <div>
                  <h4 class="font-bold text-sm">${item.name}</h4>
                  <p class="text-[#adebff] font-black text-sm mt-1">${item.price} SDG</p>
                </div>
              </div>

              <button onclick="removeItem(${item.id})" class="text-red-400 text-lg">
                <i class="bi bi-trash3-fill"></i>
              </button>
            </div>

            <div class="flex items-center justify-between mt-4">
              <div class="flex items-center gap-3 bg-black border border-gray-700 rounded-full px-3 py-1">
                <button onclick="changeQuantity(${item.id},-1)">-</button>
                <span>${item.quantity}</span>
                <button onclick="changeQuantity(${item.id},1)">+</button>
              </div>

              <span class="font-black text-[#adebff]">${item.price * item.quantity} SDG</span>
            </div>
          </div>
        `;
      }).join('');

      cartTotal.innerText = total + ' SDG';

      cartBadge.classList.remove('hidden');
      cartBadge.innerText = totalItems;
    }

    function removeItem(id){
      cart = cart.filter(item=>item.id !== id);
      saveCart();
      renderCart();
    }

    function changeQuantity(id,amount){

      const item = cart.find(i=>i.id === id);

      if(!item) return;

      item.quantity += amount;

      if(item.quantity <= 0){
        removeItem(id);
        return;
      }

      saveCart();
      renderCart();
    }

    function showToast(message){

      const toast = document.createElement('div');

      toast.className = 'toast fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#adebff] text-black font-bold py-3 px-6 rounded-full z-50';

      toast.innerText = message;

      document.body.appendChild(toast);

      setTimeout(()=>{
        toast.remove();
      },2000);
    }

    document.querySelectorAll('.category-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.category-btn').forEach(b=>b.classList.remove('active-category'));
        btn.classList.add('active-category');
        currentCategory = btn.dataset.category;
        renderProducts();
      });
    });

    document.getElementById('searchBtn').addEventListener('click',()=>{
      document.getElementById('searchContainer').classList.toggle('hidden');
    });

    document.getElementById('searchInput').addEventListener('input',(e)=>{
      searchQuery = e.target.value;
      renderProducts();
    });

    const cartBtn = document.getElementById('cartBtn');
    const cartDrawer = document.getElementById('cartDrawer');
    const cartOverlay = document.getElementById('cartOverlay');
    const closeCart = document.getElementById('closeCart');

    cartBtn.addEventListener('click',()=>{
      cartDrawer.classList.remove('-translate-x-full');
      cartOverlay.classList.remove('hidden');
    });

    closeCart.addEventListener('click',()=>{
      cartDrawer.classList.add('-translate-x-full');
      cartOverlay.classList.add('hidden');
    });

    cartOverlay.addEventListener('click',()=>{
      cartDrawer.classList.add('-translate-x-full');
      cartOverlay.classList.add('hidden');
    });

    document.getElementById('clearCartBtn').addEventListener('click',()=>{
      cart = [];
      saveCart();
      renderCart();
    });

    document.getElementById('checkoutBtn').addEventListener('click',()=>{

      if(cart.length === 0){
        alert('السلة فارغة');
        return;
      }

      let total = 0;

      let message = 'مرحباً BLACK STORE 👋%0A%0A';
      message += 'تفاصيل الطلب:%0A%0A';

      cart.forEach((item,index)=>{

        const subtotal = item.price * item.quantity;
        total += subtotal;

        message += `${index+1}. ${item.name} x${item.quantity} = ${subtotal} SDG%0A`;
      });

      message += `%0Aالإجمالي: ${total} SDG`;

      window.open(`https://wa.me/249115169965?text=${message}`,'_blank');
    });

    renderProducts();
    renderCart();

  </script>

</body>
</html>
