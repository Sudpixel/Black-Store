<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full bg-[#0B0B0B]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>BLACK STORE | لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .neon-glow { box-shadow: 0 0 15px rgba(173, 235, 255, 0.1); }
        .glass-panel {
            background: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(173, 235, 255, 0.05);
        }
        .glass-header {
            background: rgba(11, 11, 11, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(173, 235, 255, 0.08);
        }
    </style>
</head>
<body class="h-full text-white overflow-x-hidden">

    <!-- شاشة المصادقة -->
    <div id="auth-overlay" class="fixed inset-0 z-[100] bg-[#0B0B0B]/95 backdrop-blur-xl flex items-center justify-center p-4">
        <div class="w-full max-w-sm glass-panel p-6 rounded-2xl border border-gray-800 text-center space-y-4 neon-glow">
            <div class="w-12 h-12 rounded-full bg-[#adebff]/10 border border-[#adebff]/20 flex items-center justify-center text-[#adebff] text-xl mx-auto">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <div>
                <h2 class="text-sm font-black text-gray-200">منطقة الإدارة المحمية</h2>
                <p class="text-[10px] text-gray-500 font-medium mt-1">يرجى إدخال رمز المرور للوصول</p>
            </div>
            <div class="relative">
                <input type="password" id="auth-password" placeholder="••••••••" 
                       class="w-full bg-black/40 text-center text-white text-xs border border-gray-800 rounded-xl py-3 px-4 focus:outline-none focus:border-[#adebff] transition tracking-widest">
            </div>
            <button id="auth-submit-btn" class="w-full bg-[#adebff] text-[#00171f] py-2.5 rounded-xl font-black text-xs active:scale-95 transition neon-glow">
                تأكيد الهوية
            </button>
            <p id="auth-error-msg" class="text-[10px] text-red-400 font-bold hidden"><i class="bi bi-exclamation-triangle mr-1"></i> رمز المرور غير صحيح!</p>
            <button id="send-otp-btn" class="text-[10px] text-[#adebff] underline hover:text-white mt-2">الدخول عبر رابط سحري (للمسؤولين)</button>
        </div>
    </div>

    <!-- محتوى اللوحة -->
    <div id="admin-content" class="hidden">
        <header class="fixed top-0 left-0 right-0 z-50 glass-header h-16 flex items-center justify-between px-4 md:px-8 max-w-7xl mx-auto md:rounded-b-2xl">
            <div class="flex items-center gap-3">
                <div class="flex flex-col text-right">
                    <span class="text-xs font-black text-[#adebff]">لوحة التحكم</span>
                    <span class="text-[10px] text-gray-500 font-medium">الإدارة العامة</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="export-csv-btn" class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs hover:bg-emerald-500 hover:text-white transition" title="تصدير CSV"><i class="bi bi-download"></i></button>
                <button id="logout-btn" class="w-8 h-8 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 flex items-center justify-center text-xs hover:bg-red-500 hover:text-white transition"><i class="bi bi-power"></i></button>
            </div>
            <div class="text-center hidden sm:block">
                <h1 class="text-lg font-black tracking-wider text-white">Black<span class="text-[#adebff]">Admin</span></h1>
            </div>
        </header>

        <main class="pt-24 pb-12 px-4 max-w-7xl mx-auto md:px-8 space-y-6">
            <!-- إحصائيات -->
            <section class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="glass-panel p-4 rounded-2xl flex items-center justify-between neon-glow">
                    <div class="text-right"><p class="text-[10px] text-gray-400 font-bold">إجمالي المنتجات</p><h3 id="stat-total-products" class="text-xl font-black">0</h3></div>
                    <div class="w-10 h-10 rounded-xl bg-[#adebff]/10 border border-[#adebff]/20 flex items-center justify-center text-[#adebff] text-lg"><i class="bi bi-box-seam"></i></div>
                </div>
                <div class="glass-panel p-4 rounded-2xl flex items-center justify-between neon-glow">
                    <div class="text-right"><p class="text-[10px] text-gray-400 font-bold">الأقسام النشطة</p><h3 id="stat-total-categories" class="text-xl font-black text-amber-400">0</h3></div>
                    <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-lg"><i class="bi bi-grid"></i></div>
                </div>
                <div class="glass-panel p-4 rounded-2xl flex items-center justify-between neon-glow">
                    <div class="text-right"><p class="text-[10px] text-gray-400 font-bold">قيمة المخزون</p><h3 id="stat-total-value" class="text-sm font-black text-emerald-400">0 SDG</h3></div>
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 text-lg"><i class="bi bi-wallet2"></i></div>
                </div>
                <div class="glass-panel p-4 rounded-2xl flex items-center justify-between neon-glow">
                    <div class="text-right"><p class="text-[10px] text-gray-400 font-bold">متوسط السعر</p><h3 id="stat-average-price" class="text-sm font-black text-cyan-400">0 SDG</h3></div>
                    <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 text-lg"><i class="bi bi-database-check"></i></div>
                </div>
            </section>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                <!-- فورم الإضافة -->
                <section class="glass-panel p-5 rounded-2xl neon-glow border border-gray-800/60 space-y-4 lg:col-span-1">
                    <h3 class="text-sm font-black text-[#adebff] flex items-center gap-2"><span class="w-1 h-3.5 bg-[#adebff] rounded-full"></span> إضافة / تعديل منتج</h3>
                    <form id="product-form" class="space-y-3.5 text-right" novalidate>
                        <div class="space-y-1"><label class="text-[11px] text-gray-400 font-bold" for="prod-title">اسم المنتج *</label><input type="text" id="prod-title" required placeholder="ببجي 660 شدة" class="w-full bg-black/40 text-white text-xs border border-gray-800 rounded-xl py-3 px-3.5 focus:outline-none focus:border-[#adebff]"></div>
                        <div class="space-y-1"><label class="text-[11px] text-gray-400 font-bold" for="prod-id">المعرف (ID) *</label><input type="text" id="prod-id" required placeholder="pubg-660" pattern="[a-zA-Z0-9_-]+" class="w-full bg-black/40 text-white text-xs border border-gray-800 rounded-xl py-3 px-3.5 focus:outline-none focus:border-[#adebff]"></div>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="space-y-1"><label class="text-[11px] text-gray-400 font-bold" for="prod-price">السعر *</label><input type="number" id="prod-price" required placeholder="3500" min="1" class="w-full bg-black/40 text-white text-xs border border-gray-800 rounded-xl py-3 px-3.5 focus:outline-none focus:border-[#adebff]"></div>
                            <div class="space-y-1"><label class="text-[11px] text-gray-400 font-bold" for="prod-category">القسم</label><select id="prod-category" class="w-full bg-[#1A1A1A] text-white text-xs border border-gray-800 rounded-xl py-3 px-2"><option value="games">شحن ألعاب</option><option value="accessories">اكسسوارات</option><option value="series">مسلسلات</option><option value="movies">افلام</option><option value="anime">انمي</option></select></div>
                        </div>
                        <div class="space-y-1"><label class="text-[11px] text-gray-400 font-bold" for="prod-keywords">كلمات دلالية</label><input type="text" id="prod-keywords" placeholder="ببجي شدات" class="w-full bg-black/40 text-white text-xs border border-gray-800 rounded-xl py-3 px-3.5 focus:outline-none focus:border-[#adebff]"></div>
                        <div class="space-y-1"><label class="text-[11px] text-gray-400 font-bold" for="prod-description">وصف المنتج</label><textarea id="prod-description" rows="2" class="w-full bg-black/40 text-white text-xs border border-gray-800 rounded-xl py-3 px-3.5 focus:outline-none focus:border-[#adebff]"></textarea></div>
                        <div class="space-y-1"><label class="text-[11px] text-gray-400 font-bold" for="prod-icon">أيقونة Bootstrap</label><input type="text" id="prod-icon" placeholder="bi-nintendo-switch" class="w-full bg-black/40 text-white text-xs border border-gray-800 rounded-xl py-3 px-3.5 focus:outline-none focus:border-[#adebff]"></div>
                        <div class="space-y-1"><label class="text-[11px] text-gray-400 font-bold" for="prod-image">رابط الصورة</label><input type="url" id="prod-image" placeholder="https://..." class="w-full bg-black/40 text-white text-xs border border-gray-800 rounded-xl py-3 px-3.5 focus:outline-none focus:border-[#adebff]"></div>
                        <div class="space-y-1"><label class="text-[11px] text-gray-400 font-bold" for="prod-image-file">أو رفع صورة</label><input type="file" id="prod-image-file" accept="image/*" class="w-full bg-black/40 text-white text-xs border border-gray-800 rounded-xl py-3 px-3.5"></div>
                        <div class="space-y-1"><label class="text-[11px] text-gray-400 font-bold" for="prod-badge">الشارة الترويجية</label><input type="text" id="prod-badge" placeholder="شحن فوري" class="w-full bg-black/40 text-white text-xs border border-gray-800 rounded-xl py-3 px-3.5 focus:outline-none focus:border-[#adebff]"></div>
                        <button type="submit" class="w-full bg-[#adebff] text-[#00171f] py-3 rounded-xl font-black text-xs active:scale-95 neon-glow">حفظ المنتج</button>
                    </form>
                </section>

                <!-- جدول المنتجات -->
                <section class="glass-panel p-5 rounded-2xl neon-glow border border-gray-800/60 lg:col-span-2 space-y-4">
                    <div class="flex justify-between items-center"><h3 class="text-sm font-black text-[#adebff] flex items-center gap-2"><span class="w-1 h-3.5 bg-[#adebff] rounded-full"></span> المنتجات الحالية</h3><span id="product-count-badge" class="text-[10px] bg-gray-800 text-gray-400 font-bold px-2 py-0.5 rounded-full">0</span></div>
                    <div class="overflow-x-auto no-scrollbar rounded-xl border border-gray-800/50">
                        <table class="w-full text-right text-xs">
                            <thead class="bg-black/40 text-gray-400 font-bold border-b border-gray-800"><tr><th class="p-3">المنتج</th><th class="p-3">القسم</th><th class="p-3">السعر</th><th class="p-3 text-center">إجراءات</th></tr></thead>
                            <tbody id="admin-products-table" class="divide-y divide-gray-800/40"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        // ===================== الإعدادات العامة =====================
        const CORRECT_KEY = "panda@2025";
        const AUTH_SESSION_KEY = 'black_store_admin_auth';
        const authOverlay = document.getElementById('auth-overlay');
        const adminContent = document.getElementById('admin-content');
        const authPasswordInput = document.getElementById('auth-password');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const authErrorMsg = document.getElementById('auth-error-msg');
        const logoutBtn = document.getElementById('logout-btn');
        const exportCsvBtn = document.getElementById('export-csv-btn');
        const productForm = document.getElementById('product-form');
        const productsTable = document.getElementById('admin-products-table');
        const statTotalProducts = document.getElementById('stat-total-products');
        const statTotalCategories = document.getElementById('stat-total-categories');
        const statTotalValue = document.getElementById('stat-total-value');
        const statAveragePrice = document.getElementById('stat-average-price');
        const productCountBadge = document.getElementById('product-count-badge');
        const sendOtpBtn = document.getElementById('send-otp-btn');

        let storeProducts = [];

        // ===================== المصادقة =====================
        function checkAuth() {
            try {
                const authData = sessionStorage.getItem(AUTH_SESSION_KEY);
                if (authData) {
                    const parsed = JSON.parse(authData);
                    if (parsed.expires > Date.now()) {
                        authOverlay.classList.add('hidden');
                        adminContent.classList.remove('hidden');
                        loadProductsAndRender();
                        return;
                    }
                }
            } catch (e) {}
            authOverlay.classList.remove('hidden');
            adminContent.classList.add('hidden');
        }

        function setAuthSession() {
            sessionStorage.setItem(AUTH_SESSION_KEY, JSON.stringify({ expires: Date.now() + 2*60*60*1000 }));
        }

        authSubmitBtn.addEventListener('click', () => {
            if (authPasswordInput.value === CORRECT_KEY) {
                setAuthSession();
                authOverlay.classList.add('hidden');
                adminContent.classList.remove('hidden');
                authErrorMsg.classList.add('hidden');
                loadProductsAndRender();
            } else {
                authErrorMsg.classList.remove('hidden');
            }
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem(AUTH_SESSION_KEY);
            window.location.reload();
        });

        // رابط سحري اختياري
        sendOtpBtn.addEventListener('click', () => {
            const email = prompt('أدخل بريد المسؤول الإلكتروني:');
            if (email) {
                auth.sendSignInLinkToEmail(email, { url: window.location.href, handleCodeInApp: true })
                    .then(() => alert('تم إرسال رابط الدخول إلى بريدك'))
                    .catch(err => alert('خطأ: ' + err.message));
            }
        });

        // ===================== تحميل المنتجات =====================
        async function loadProductsAndRender() {
            try {
                const snap = await db.collection('products').get();
                storeProducts = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (e) {
                storeProducts = [];
            }
            renderAdminTable();
        }

        function renderAdminTable() {
            productsTable.innerHTML = '';
            const total = storeProducts.length;
            statTotalProducts.innerText = total;
            productCountBadge.innerText = `${total} منتجات`;
            const cats = [...new Set(storeProducts.map(p => p.category))].length;
            statTotalCategories.innerText = cats;
            const totalValue = storeProducts.reduce((sum, p) => sum + (Number(p.price)||0), 0);
            statTotalValue.innerText = `${totalValue.toLocaleString()} SDG`;
            statAveragePrice.innerText = total ? `${Math.round(totalValue/total).toLocaleString()} SDG` : '0 SDG';

            if (total === 0) {
                productsTable.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-500">لا توجد منتجات</td></tr>';
                return;
            }

            storeProducts.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-white/[0.02]';
                const imgHtml = p.image ? `<img src="${p.image}" alt="" class="w-5 h-5 rounded" onerror="this.style.display='none'">` : '';
                tr.innerHTML = `
                    <td class="p-3 font-bold text-gray-200 flex items-center gap-2">${imgHtml} <span class="truncate max-w-[140px]">${sanitize(p.title)}</span></td>
                    <td class="p-3 text-gray-400">${categoryLabel(p.category)}</td>
                    <td class="p-3 text-[#adebff] font-black">${(p.price||0).toLocaleString()} SDG</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteProduct('${p.id}')" class="w-7 h-7 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500 hover:text-white transition"><i class="bi bi-trash3 text-xs"></i></button>
                    </td>
                `;
                productsTable.appendChild(tr);
            });
        }

        function categoryLabel(cat) {
            const map = { games: 'شحن ألعاب', accessories: 'اكسسوارات', series: 'مسلسلات', movies: 'افلام', anime: 'انمي' };
            return map[cat] || cat;
        }

        function sanitize(str) { return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }

        window.deleteProduct = async function(id) {
            if (confirm('تأكيد الحذف؟')) {
                try {
                    await db.collection('products').doc(id).delete();
                    storeProducts = storeProducts.filter(p => p.id !== id);
                    renderAdminTable();
                } catch (e) { alert('فشل الحذف'); }
            }
        };

        // ===================== إضافة / تعديل منتج =====================
        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('prod-id').value.trim();
            const title = document.getElementById('prod-title').value.trim();
            const price = parseInt(document.getElementById('prod-price').value);
            const category = document.getElementById('prod-category').value;
            const keywords = document.getElementById('prod-keywords').value.trim();
            const description = document.getElementById('prod-description').value.trim();
            const icon = document.getElementById('prod-icon').value.trim() || 'bi-box';
            const badge = document.getElementById('prod-badge').value.trim();
            
            if (!id || !title || isNaN(price) || price <= 0) { alert('الرجاء ملء الحقول المطلوبة'); return; }

            let imageUrl = document.getElementById('prod-image').value.trim();
            const imageFile = document.getElementById('prod-image-file').files[0];
            if (imageFile) {
                try {
                    const ref = storage.ref(`products/${id}/${Date.now()}-${imageFile.name}`);
                    await ref.put(imageFile);
                    imageUrl = await ref.getDownloadURL();
                } catch (err) { alert('فشل رفع الصورة'); return; }
            }

            const productData = { title, price, category, keywords, description, icon, badge, image: imageUrl };
            try {
                await db.collection('products').doc(id).set(productData, { merge: true });
                const idx = storeProducts.findIndex(p => p.id === id);
                if (idx > -1) storeProducts[idx] = { id, ...productData };
                else storeProducts.push({ id, ...productData });
                renderAdminTable();
                productForm.reset();
                alert('تم الحفظ بنجاح!');
            } catch (err) { alert('فشل الحفظ'); }
        });

        // ===================== تصدير CSV =====================
        exportCsvBtn.addEventListener('click', async () => {
            try {
                const snap = await db.collection('orders').get();
                let csv = 'OrderID,Date,UserID,Total,Status\n';
                snap.forEach(doc => {
                    const o = doc.data();
                    csv += `${doc.id},${o.createdAt || ''},${o.userId || 'guest'},${o.total},${o.status}\n`;
                });
                const blob = new Blob([csv], {type: 'text/csv'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `orders-${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
            } catch(e) { alert('فشل التصدير'); }
        });

        // ===================== بدء التشغيل =====================
        checkAuth();
    </script>
</body>
</html>
